<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Matthew Park" />
    <!-- the tennis ball, as the cursor and the footer court draw it -->
    <link rel="icon" type="image/svg+xml" href="/favicon-ball.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- All SIL OFL: Saira Semi Condensed + JetBrains Mono for the small
         type (standing in for PP Supply), and the F1-titles trio: Archivo
         Expanded for surnames, Mrs Saint Delafield for the signature,
         Michroma for numbers. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800&family=JetBrains+Mono:wght@400&family=Michroma&family=Mrs+Saint+Delafield&family=Saira+Semi+Condensed:wght@400;600;700&display=swap"
    />
    <script>
      // Decided before the first paint: whether the intro runs (skipped with
      // ?skip and under reduced motion; the LUT, call and privacy pages never
      // hold for it).
      ;(function () {
        var html = document.documentElement
        var q = location.search
        var legacy = /^\/(lut|call|privacy)/.test(location.pathname)
        var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
        if (!reduced && !legacy && !/[?&]skip(&|=|$)/.test(q)) html.className += ' is-loading'
      })()
    </script>
    <title>Matthew Park</title>
    <meta
      name="description"
      content="Matthew Park, a kid from Kentucky. Founder of Nudgy, an iPhone assistant that listens to your day, and Axiom Pathways, a nonprofit getting young people into startup internships."
    />
    <meta property="og:title" content="Matthew Park" />
    <meta property="og:description" content="Founder of Nudgy and Axiom Pathways." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://matthewnpark.com/" />
    <meta property="og:image" content="https://matthewnpark.com/og-simple.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Matthew Park as a stick figure, next to a handwritten note about Nudgy and Axiom Pathways" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://matthewnpark.com/og-simple.jpg" />
    <link rel="canonical" href="https://matthewnpark.com/" />
    <meta name="theme-color" content="#f7f7f4" />
    <style>
      /* first paint only: white before the CSS arrives */
      html, body { background-color: #f7f7f4; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
